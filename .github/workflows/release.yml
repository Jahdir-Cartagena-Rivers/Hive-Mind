name: Release Hive Mind
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test test/updater.test.mjs test/service.test.mjs
      - run: npm run dist -- --x64 --publish never
      - run: node scripts/update-manifest.mjs
      - name: Publish verified update assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) { throw 'Tag and package versions differ' }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Release already exists; immutable assets must not be replaced' }
          gh release create $tag "dist/Hive-Mind-Setup-$version-x64.exe" dist/hive-mind-update.json --target $env:GITHUB_SHA --title "Hive Mind $version" --notes-file RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
